services:
  couchcasino:
    image: ghcr.io/idobaruch7/couchcasino:nightly
    build: .
    ports:
      - '${COUCHCASINO_PORT:-5000}:5000'
    environment:
      COUCHCASINO_SECRET_KEY: ${COUCHCASINO_SECRET_KEY:-couchcasino-dev-secret}
      COUCHCASINO_HOST: 0.0.0.0
      COUCHCASINO_PORT: 5000
      COUCHCASINO_DEBUG: ${COUCHCASINO_DEBUG:-0}
      COUCHCASINO_DATABASE_URL: ${COUCHCASINO_DATABASE_URL:-postgresql+psycopg://couchcasino@postgres:5432/couchcasino}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: couchcasino
      POSTGRES_USER: couchcasino
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U couchcasino -d couchcasino']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
